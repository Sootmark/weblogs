[package]
name = "sootmark-weblogs"
version = "0.3.0"
edition = "2021"
rust-version = "1.80"
description = "Web server access logs for forensics: Apache and nginx (common, combined, virtual host), Jira, Confluence and Bitbucket, AWS load balancers (ELB) and Azure Application Gateway, read into requests with their client, user, time and status; and Atlassian's application and audit logs (Jira, Confluence, Bitbucket), read into entries with their time, level, thread, logger, user, address, action and object."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sootmark/weblogs"
homepage = "https://sootmark.com"
keywords = ["forensics", "dfir", "incident-response", "apache", "nginx"]
# Sources only: test fixtures stay in the repository.
include = ["/src", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[lib]
name = "weblogs"

[dependencies]
common = { package = "sootmark-common", version = "0.3.7" }

[dev-dependencies]
proptest = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
